# docker-compose.yml
# Foundation-System / Scaffold-Module: Orchestrates PostgreSQL 16.6, Mailpit v1.21.4, ASP.NET Core 8.0 API, React Vite frontend, and Nginx 1.27.3 reverse proxy.

services:
  kalate-postgres:
    image: postgres:16.6-alpine
    container_name: kalate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-50003}:5432"
    volumes:
      - kalate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kalate-net

  kalate-mailpit:
    image: axllent/mailpit:v1.21.4
    container_name: kalate-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-50005}:8025"
      - "${MAILPIT_SMTP_PORT:-50006}:1025"
    networks:
      - kalate-net

  kalate-api:
    build:
      context: ./backend/src/KalateManager.Api
      dockerfile: Dockerfile
    container_name: kalate-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      PLATFORM_VERSION: ${PLATFORM_VERSION:-1.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://192.168.100.100:50000,https://localhost:50000}
      ConnectionStrings__DefaultConnection: Host=kalate-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:-KalateManager}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-KalateManagerClients}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-kalate-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@kalate.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Kalate Manager}
      RATE_LIMIT_PUBLIC_PER_MINUTE: ${RATE_LIMIT_PUBLIC_PER_MINUTE:-60}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
    ports:
      - "${API_PORT:-50002}:8080"
    depends_on:
      kalate-postgres:
        condition: service_healthy
      kalate-mailpit:
        condition: service_started
    networks:
      - kalate-net

  kalate-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kalate-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-50004}:5173"
    networks:
      - kalate-net

  kalate-nginx:
    image: nginx:1.27.3-alpine
    container_name: kalate-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTPS_PORT:-50000}:443"
      - "${NGINX_HTTP_PORT:-50001}:80"
    volumes:
      - ./nginx/Foundation-System-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - kalate-api
      - kalate-frontend
    networks:
      - kalate-net

volumes:
  kalate_postgres_data:

networks:
  kalate-net:
    driver: bridge
