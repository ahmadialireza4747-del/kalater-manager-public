# nginx/Foundation-System-nginx.conf
# Foundation-System / Scaffold-Module: Reverse proxy with HTTPS termination, HTTP->HTTPS redirect, edge rate limiting (D-011), and Host header pass-through for custom domains (D-009).

limit_req_zone $binary_remote_addr zone=api_edge_zone:10m rate=40r/s;

server {
    listen 80;
    server_name _;

    set $redirect_host $host;
    if ($redirect_host ~* ^([^:]+)) {
        set $redirect_host $1;
    }

    return 301 https://$redirect_host:50000$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/kalate-dev.crt;
    ssl_certificate_key /etc/nginx/certs/kalate-dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # Backend REST API
    location /api/ {
        limit_req zone=api_edge_zone burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://kalate-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (Development only)
    location /swagger {
        proxy_pass http://kalate-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Vite SPA
    location / {
        proxy_pass http://kalate-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
